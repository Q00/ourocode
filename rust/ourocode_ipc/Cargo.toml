[package]
name = "ourocode_ipc"
version = "0.1.0"
edition = "2021"
description = "Rust-side IPC/RPC request decoding for ourocode helper workers"
publish = false

[lib]
name = "ourocode_ipc"
path = "src/lib.rs"

[[bin]]
name = "ourocode_tty"
path = "src/bin/ourocode_tty.rs"

[[bin]]
name = "ourocode"
path = "src/bin/ourocode.rs"

[dependencies]
serde_json = "1"
libc = "0.2"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
] }
