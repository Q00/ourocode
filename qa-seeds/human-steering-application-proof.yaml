  - "Do not modify files or make network requests."
  - "Keep the first provider turn open long enough for a human to select the exact attempt and queue one message."
acceptance_criteria:
  - "As worker A, run the harmless bounded command `sleep 90`, then report `INITIAL_TURN_COMPLETE`. If a Synapse follow-up arrives after that turn, obey it and include its requested exact marker in the reply."
