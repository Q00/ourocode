name: windows-ci

# Builds and tests the native Windows code paths that Linux CI cannot cover:
# the entire ourocode_tty.rs helper lives behind `#[cfg(windows)]`, so it is
# never compiled on the Unix regression runner. This job compiles the helper
# (and the ourocode launcher) on a real Windows runner, runs the Rust unit
# tests, then compiles and runs the Elixir suite against the built helper.

on:
  push:
    branches:
      - "feat/v0.1.15"
      - "feat/windows-tui-helper-events"
      - "release/**"
  pull_request:
    paths:
      - "rust/ourocode_ipc/**"
      - "lib/ourocode/terminal/tty_driver.ex"
      - "lib/ourocode/terminal/tui_login.ex"
      - "lib/ourocode/terminal/tui_input_loop.ex"
      - "lib/ourocode/terminal/tui_driver_session.ex"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-test:
    name: Windows build + test
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Set up Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/ourocode_ipc/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/ourocode_ipc/Cargo.lock') }}

      - name: Build native helper + launcher (compiles the #[cfg(windows)] code)
        shell: pwsh
        run: cargo build --release --manifest-path rust/ourocode_ipc/Cargo.toml

      - name: Rust unit tests
        shell: pwsh
        run: cargo test --manifest-path rust/ourocode_ipc/Cargo.toml

      - name: Stage helper into bin/ (matches TtyDriver.helper_path lookup)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item rust/ourocode_ipc/target/release/ourocode_tty.exe bin/ourocode_tty.exe -Force
          if (Test-Path rust/ourocode_ipc/target/release/ourocode.exe) {
            Copy-Item rust/ourocode_ipc/target/release/ourocode.exe bin/ourocode.exe -Force
          }

      - name: Fetch Mix dependencies
        shell: pwsh
        run: mix deps.get

      - name: Compile (warnings as errors)
        shell: pwsh
        run: mix compile --warnings-as-errors

      - name: Elixir test suite
        shell: pwsh
        run: mix test
