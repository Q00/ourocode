[package]
name = "ouro-broker"
version = "0.1.0"
edition = "2021"
description = "Single-loop durable PTY broker for Ourocode Desktop"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "ouro-broker"
path = "src/main.rs"

[[bin]]
name = "ouro-broker-v4"
path = "src/main_v4.rs"

[[bin]]
name = "ouro-broker-v4-ghostty"
path = "src/main_v4_ghostty.rs"
required-features = ["ghostty-engine"]

[features]
default = []
ghostty-engine = ["dep:ouro-terminal-ghostty"]

[dependencies]
base64 = "0.22"
getrandom = "0.2"
libc = "0.2"
ouro-session = { path = "../ouro-session" }
ouro-terminal-ghostty = { path = "../ouro-terminal-ghostty", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
unicode-normalization = "0.1"
vt100 = "=0.15.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Servo's small CoreFoundation ownership layer. Security.framework itself is
# called through the narrow FFI surface audited in `desktop_peer_verifier.rs`.
core-foundation = "0.10.1"

[dev-dependencies]
tempfile = "3"
